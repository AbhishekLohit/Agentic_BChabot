
name: Banking Chatbot Evaluation Tests

on:
  push:
    branches:
      - feature/evaluation-framework
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluation-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run evaluation unit tests
        run: |
          python -m unittest discover -s tests -p 'test_evaluation.py' -v

      - name: Validate evaluation dataset
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("evaluation/cases.jsonl")
          cases = [
              json.loads(line)
              for line in path.read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]

          assert cases, "No evaluation cases found"
          print(f"Validated {len(cases)} evaluation cases")
          PY
