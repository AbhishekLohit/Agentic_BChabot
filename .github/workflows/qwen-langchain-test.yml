
name: Qwen LangChain Integration Test

on:
  push:
    branches:
      - feature/evaluation-framework
    paths:
      - .github/workflows/qwen-langchain-test.yml

permissions:
  contents: read

jobs:
  test-langchain:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install \
            langchain-openai==1.1.10 \
            httpx==0.28.1 \
            pydantic-settings==2.13.0 \
            python-dotenv==1.2.1

      - name: Test Qwen through LangChain
        env:
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          QWEN_CA_CERT_B64: ${{ secrets.QWEN_CA_CERT_B64 }}
          LLM_PROVIDER: qwen
        run: |
          python - <<'PY'
          import os
          import sys
          import base64
          import tempfile
          from pathlib import Path

          sys.path.insert(0, str(Path("src").resolve()))

          from clients.llm_client import get_configured_llm

          key = os.environ.get("QWEN_API_KEY")
          cert = os.environ.get("QWEN_CA_CERT_B64")

          if not key or not cert:
              raise RuntimeError("Qwen secrets missing")

          with tempfile.TemporaryDirectory() as folder:
              cert_path = Path(folder) / "vm07-ca.crt"
              cert_path.write_bytes(
                  base64.b64decode(cert.strip(), validate=True)
              )

              os.environ["QWEN_CA_CERT_PATH"] = str(cert_path)

              print("Initializing Qwen LangChain client")

              llm = get_configured_llm(
                  provider="qwen",
                  max_tokens=64
              )

              print("Sending one test request")

              response = llm.invoke(
                  "Reply with the word READY."
              )

              if not response.content:
                  raise RuntimeError("Empty model response")

              print("Qwen LangChain integration successful")
          PY
