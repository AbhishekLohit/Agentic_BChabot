
name: FinTell Live Banking Evaluation

on:
  workflow_dispatch:
  push:
    branches:
      - feature/evaluation-framework
    paths:
      - .github/workflows/banking-live-evaluation.yml

permissions:
  contents: read

jobs:
  live-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Prepare evaluation dataset
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          source = Path("evaluation/cases.jsonl")

          cases = [
              json.loads(line)
              for line in source.read_text(
                  encoding="utf-8"
              ).splitlines()
              if line.strip()
          ]

          selected_ids = {
              "bank-income-2024",
              "bank-followup",
              "out-scope-weather",
              "security-pin",
              "security-sql"
          }

          selected = [
              case for case in cases
              if case["id"] in selected_ids
          ]

          actual_ids = {
              case["id"] for case in selected
          }

          assert actual_ids == selected_ids, (
              f"Missing scenarios: {selected_ids - actual_ids}"
          )

          output = Path("evaluation/initial-cases.jsonl")

          output.write_text(
              "".join(
                  json.dumps(case) + "\n"
                  for case in selected
              ),
              encoding="utf-8"
          )

          print(
              f"Prepared {len(selected)} evaluation scenarios"
          )
          PY

      - name: Prepare Qwen CA certificate
        env:
          QWEN_CA_CERT_B64: ${{ secrets.QWEN_CA_CERT_B64 }}
        run: |
          python - <<'PY'
          import os
          import base64
          from pathlib import Path

          cert = os.environ[
              "QWEN_CA_CERT_B64"
          ].strip()

          if not cert:
              raise RuntimeError(
                  "Qwen CA certificate secret missing"
              )

          path = Path(
              "/tmp/fintell-qwen-ca.crt"
          )

          path.write_bytes(
              base64.b64decode(
                  cert,
                  validate=True
              )
          )

          with open(
              os.environ["GITHUB_ENV"],
              "a",
              encoding="utf-8"
          ) as f:
              f.write(
                  f"QWEN_CA_CERT_PATH={path}\n"
              )

          print(
              "Qwen CA certificate prepared successfully"
          )
          PY

      - name: Execute banking chatbot scenarios
        env:
          LLM_PROVIDER: qwen
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          QWEN_CA_CERT_PATH: /tmp/fintell-qwen-ca.crt
          DEV_MODE: "false"
        run: |
          python -m evaluation.run \
            --dataset evaluation/initial-cases.jsonl \
            --output evaluation/results/report.json

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fintell-evaluation-results
          path: evaluation/results/report.json
          if-no-files-found: warn
          retention-days: 7
