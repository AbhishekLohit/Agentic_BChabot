# FinTell end-to-end golden set  (schema: evaluation/e2e/README.md)
#
# Built ANSWER-FIRST from the raw data: every reference SQL was written and run against
# transactions.db (customer Cust_0410) and every evidence quote copied verbatim from
# data/help_documents before the question was written. Validate with:
#     python evaluation/e2e/validate.py
#
# Conventions
#   - any field given as a list of alternatives means "any of these is correct".
#   - must_mention items: a string (case-insensitive substring), a list (any of), or "$sql"
#     (every number in the reference SQL result must appear in the reply, ±1p / rounding).
#   - "today" is the day of the run. Relative-date SQL uses SQLite date('now'), the same
#     clock the app's own SQL uses, and is recomputed at scoring time.
#   - Disputes run as dialogues: a rule-based simulated customer answers whatever the agent
#     asks (by DisputeResult.status / slot_ids) from the case's `facts`.

version: 1
customer_id: Cust_0410
cases:

# ===================================================================== BankSQL: standalone
- id: SQL-01
  category: banksql_standalone
  difficulty: easy
  split: dev
  turns:
  - user: How much did I spend in October 2026?
    expect:
      guardrail: SAFE
      context: [{must_keep: [[spend, spent, spending], [october 2026, 2026-10, oct 2026]]}]
      routes: [BankSQL]
      subagents: [sql_generation]
      sql: [{reference: "SELECT ROUND(SUM(amount_usd),2) FROM transactions WHERE customer_id='Cust_0410' AND transaction_type!='income' AND year=2026 AND month=10", compare: scalar}]
      response: {behavior: answer, must_mention: ["$sql"]}
  task: answer

