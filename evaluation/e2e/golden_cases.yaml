# ===================================================================== HelpCenter (RAG): answerable
- id: HLP-01
  category: help_answerable
  difficulty: easy
  split: dev
  turns:
  - user: I think I've lost my debit card, how can I block it?
    expect:
      guardrail: SAFE
      context: [{must_keep: [[block], [card]]}]
      routes: [HelpCenter]
      subagents: [help_center]
      rag:
        answerable: true
        evidence:
        - {doc: kb_0273_mobile-internet-banking-card-management.md, quote: "If you have lost your card, blocking it immediately prevents unauthorized use."}
        - {doc: kb_0272_mobile-internet-banking-card-management.md, quote: "If the card is lost permanently, you can lock it permanently and request a replacement."}
        key_facts: ["Block the card in net banking or the mobile app (Cards / Debit Card section, Block Card)"]
        optional_facts: ["The block can be temporary or permanent", "A replacement card can be requested"]
      response: {behavior: answer, must_mention: [[block, lock]]}
  task: answer

