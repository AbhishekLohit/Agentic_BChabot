prompt: |
  You are an expert dataset generator for evaluating a Context Builder Agent used in an online food ordering chatbot.

  --------------------------------------------------
  ## OBJECTIVE
  --------------------------------------------------

    Generate a batch of high-quality, diverse, and non-repetitive test samples.

    Each sample must contain:
    1. chat_history (multi-turn conversation)
    2. latest_user_question (SCENARIO DRIVEN and intentionally ambiguous)

    The goal is to create samples where the latest_user_question CANNOT be understood without chat_history.

  --------------------------------------------------
  ## DOMAIN CONSTRAINT
  --------------------------------------------------

    The chatbot ONLY answers questions about a users **past food orders within the last 1 year**.

    DO NOT generate:
      - Food discovery queries
      - General chit-chat unrelated to orders
      - Future orders
      - Any queries referring to time beyond the past 1 year

  --------------------------------------------------
   ## INPUTS PROVIDED
  --------------------------------------------------

    1. BATCH_SIZE: {BATCH_SIZE}
    2. SCENARIO_NAME: {SCENARIO_NAME}
    3. SCENARIO_DESCRIPTION: {SCENARIO_DESCRIPTION}
    4. *DATABASE_VALUES*:
      - restaurant_names (list): {RESTAURANT_NAMES}
      - food_items (list): {FOOD_ITEMS}

  
  --------------------------------------------------
  ## CHAT HISTORY GENERATION RULES
  --------------------------------------------------

    # CHAT HISTORY STRUCTURE
      - Include 3 to 5 user-assistant turns
    
    # TIMEFRAME CONSTRAINT

      The chatbot only has access to **last 1 year of data**.

      CHAT HISTORY MUST:
      - Always include **explicit or implicit time references** in each user-ai pair in chat history.

      VALID time expressions examples:
        - in 'year' format (e.g., 'in 2024')"
        - in 'month-year' format (e.g., 'in Jan 2025')"
        - relative time expressions (e.g., 'last 2 months','last year', 'in the last 6 months',)

    # USER-AI Pair Grounding

      The chatbot ultimately converts user queries into SQL.  
      This TABLE schema defines what information is actually available.

      - The generated USER-AI pair MUST be grounded in real data fields mentioned in the schema.
      - Use the BELOW DATA FIELDS in the schema to create realistic conversations.
      
      - #AVAILABLE TABLE DATA FIELDS#:

      - restaurants
        Contains information about restaurants:
        - name → restaurant name
        - avg_cost_for_2 → cost estimate
        - rating → overall rating
        
      - orders
        Contains details of each order:
        - order_timestamp / order_day / order_time_slot → time references
        - order_cost / order_amount_paid → spending queries
        - order_delivery_time_mins → delivery time
        - ordered_items_count → number of items
        
      - order_items
        Contains item-level details:
        - food_item → item name
        - food_item_cost → item price

    
      - RELATIONSHIPS
        - orders.restaurant_id → restaurants.restaurant_id
        - order_items.order_id → orders.order_id


    # STRICT DATA GROUNDING RULE for USER-AI Pairs in chat history
      - You MUST use ONLY values from *DATABASE_VALUES* FOR:
        - restaurant names
        - food items
      - DO NOT invent:
        - restaurant names
        - food items

  
  --------------------------------------------------
  ## LATEST USER QUESTION RULES
  --------------------------------------------------

    - Latest user question MUST be directly related to the scenario given in SCENARIO_DESCRIPTION. For eg: if the scenario is "greetings" then the latest user question could be "Hi, can you help me please".
    - It MUST be intentionally ambiguous.
    - It MUST be a valid question that can be answered by the table schema and the information in the chat history.For eg: Did I like it? is NOT a valid question as there is no data field in #AVAILABLE TABLE DATA FIELDS# that captures user satisfaction or enjoyment.
    

  --------------------------------------------------
  ## INTERNAL REASONING STEPS (DO NOT OUTPUT)
  --------------------------------------------------

    For EACH sample:
    1. Understand the given scenario and its description.
    2. Create chat history using the CHAT HISTORY GENERATION RULES.
    3. Design ambiguous latest user question using the LATEST USER QUESTION RULES.


    THINK STEP BY STEP


  --------------------------------------------------

  ## 📤 OUTPUT FORMAT (STRICT JSON)

  Return ONLY valid JSON:

  {{
    "samples": [
      {{
        "chat_history": [
          {{"user": "...", "assistant": "..."}},
          {{"user": "...", "assistant": "..."}}
        ],
        "latest_user_question": "...",
      }}
    ]
  }}

  ## FEW SHOT EXAMPLES

  # TEST SAMPLE 1:
  
  scenario : missing resturant in latest user question
  
  chat_history:
  user: what is my total spending in the last 6 months?
  assistant: Your total spending in the last 6 months is RS 150.
  user: which restaurant was the most expensive?
  assistant: The most expensive restaurant you ordered from in the last 6 months was Dhuaan.

  latest_user_question:
  user: how much did I spend there?

  # TEST SAMPLE 2:

  scenario: greeting

  chat_history:
  user: show me the orders I made last year
  assistant: You made 5 orders last year from the following restaurants: Dhuaan, Biryani House, Spice Villa, Curry Corner, and Tandoori Treats.
  user: which one was the cheapest? 
  assistant: The cheapest restaurant you ordered from last year was Curry Corner.

  latest_user_question:
  user: Hi, can you help me please?

  # TEST SAMPLE 3:

  scenario: multiple user questions

  chat_history:
  user: did I order anything from Biryani House in the last 3 months?
  assistant: Yes, you ordered from Biryani House 2 times in the last 3 months.
  user: what did I order?
  assistant: You ordered Chicken Biryani and Mutton Biryani from Biryani House in the last 3 months.

  latest_user_question:
  user: how much did the Chicken Biryani cost and how long did delivery take?




  