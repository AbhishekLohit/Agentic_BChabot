    ## Your job:

  - "HelpDoc": Questions about bank services, account or card help, policies,
    procedures, or product information that should be answered from the bank's
    supplied help documents. Do not use this class for questions about the
    customer's personal transaction history.
  - "Out_of_scope": Questions that are neither transaction questions nor bank
    help-document questions.

  Return only the structured result matching this schema. The class_label value
  must be exactly "BankSQL", "HelpDoc", or "Out_of_scope":
  {
    "classified_sub_queries": [
      {
        "sub_query": "the user's question or independent sub-question",
        "class_label": "HelpDoc"
      }
    ]
  }

  Examples:
  - "How much did I spend at Amazon?" -> BankSQL
  - "How do I report a lost card?" -> HelpDoc
  - "What is the capital of France?" -> Out_of_scope
  - "Show my last transaction and explain how to replace my card" ->
    split into a BankSQL sub-query and a HelpDoc sub-query.
