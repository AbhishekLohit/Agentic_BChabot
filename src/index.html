<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B-Bot Transaction Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background: radial-gradient(circle at 50% 50%, #171126 0%, #08040d 100%);
            color: #f1f1f1;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .dashboard-container {
            width: 90%;
            max-width: 1000px;
            height: 85vh;
            background: rgba(20, 12, 33, 0.45);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), inset 0 0 2px rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Top Header */
        .dashboard-header {
            padding: 20px 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.01);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 12px #10b981;
            transition: all 0.3s ease;
        }

        .status-dot.listening {
            background: #ef476f;
            box-shadow: 0 0 15px #ef476f;
            animation: pulse-dot 1.2s infinite;
        }

        .status-dot.speaking {
            background: #06b6d4;
            box-shadow: 0 0 15px #06b6d4;
            animation: pulse-dot 1.2s infinite;
        }

        @keyframes pulse-dot {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }

        .header-title h2 {
            font-size: 1.25rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            color: #ffffff;
        }

        .header-title p {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.45);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        /* TTS Voice Toggle */
        .voice-toggle-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            user-select: none;
        }

        .voice-toggle-checkbox {
            appearance: none;
            width: 38px;
            height: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            position: relative;
            outline: none;
            cursor: pointer;
            transition: background 0.3s;
        }

        .voice-toggle-checkbox:checked {
            background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
        }

        .voice-toggle-checkbox::before {
            content: '';
            position: absolute;
            width: 14px;
            height: 14px;
            background: #ffffff;
            border-radius: 50%;
            top: 3px;
            left: 3px;
            transition: left 0.3s;
        }

        .voice-toggle-checkbox:checked::before {
            left: 21px;
        }

        /* Chat Messages Board */
        .chat-board {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        .chat-board::-webkit-scrollbar {
            width: 6px;
        }

        .chat-board::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-board::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }

        .chat-board::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .message {
            max-width: 75%;
            padding: 14px 20px;
            font-size: 0.95rem;
            line-height: 1.5;
            position: relative;
            animation: slide-up 0.3s ease forwards;
            opacity: 0;
            transform: translateY(10px);
        }

        @keyframes slide-up {
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #7c3aed 0%, #4f46e5 100%);
            border-radius: 20px 20px 4px 20px;
            box-shadow: 0 8px 25px rgba(124, 58, 237, 0.25);
            color: #ffffff;
        }

        .message.assistant {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px 20px 20px 4px;
            color: #e5e5e5;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
        }

        .system-note {
            display: block;
            margin-top: 8px;
            font-size: 0.78rem;
            color: #ef476f;
            font-style: italic;
            opacity: 0.85;
        }

        /* Waveform Animation */
        .listening-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(8, 4, 13, 0.85);
            backdrop-filter: blur(15px);
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 30px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .listening-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .listening-overlay h3 {
            font-size: 1.5rem;
            font-weight: 400;
            color: #ffffff;
        }

        .listening-overlay p {
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.9rem;
            height: 20px;
        }

        .waveform {
            display: flex;
            align-items: center;
            gap: 6px;
            height: 80px;
        }

        .wave-bar {
            width: 5px;
            height: 15px;
            background: linear-gradient(to top, #7c3aed, #ef476f);
            border-radius: 10px;
            animation: quiet 1.2s ease-in-out infinite;
        }

        .listening-overlay.active .wave-bar {
            animation: bounce 1.2s ease-in-out infinite;
        }

        .wave-bar:nth-child(2) { animation-delay: 0.15s; }
        .wave-bar:nth-child(3) { animation-delay: 0.3s; }
        .wave-bar:nth-child(4) { animation-delay: 0.45s; }
        .wave-bar:nth-child(5) { animation-delay: 0.6s; }
        .wave-bar:nth-child(6) { animation-delay: 0.75s; }
        .wave-bar:nth-child(7) { animation-delay: 0.9s; }

        @keyframes bounce {
            0%, 100% { height: 15px; }
            50% { height: 75px; }
        }
        @keyframes quiet {
            0%, 100% { height: 15px; }
            50% { height: 25px; }
        }

        /* Chat Input Section */
        .chat-input-area {
            padding: 25px 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(0, 0, 0, 0.1);
        }

        .input-box-wrapper {
            flex: 1;
            position: relative;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            display: flex;
            align-items: center;
            padding: 4px 15px;
            transition: all 0.3s;
        }

        .input-box-wrapper:focus-within {
            border-color: rgba(124, 58, 237, 0.5);
            box-shadow: 0 0 15px rgba(124, 58, 237, 0.15);
            background: rgba(255, 255, 255, 0.05);
        }

        .input-box-wrapper input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 0.95rem;
            padding: 12px 10px;
        }

        .input-box-wrapper input::placeholder {
            color: rgba(255, 255, 255, 0.25);
        }

        /* Microphone & Action Buttons */
        .action-btn {
            background: transparent;
            border: none;
            outline: none;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s;
        }

        .mic-btn {
            width: 46px;
            height: 46px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            color: #e5e5e5;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .mic-btn:hover {
            background: rgba(239, 71, 111, 0.1);
            border-color: rgba(239, 71, 111, 0.3);
            color: #ef476f;
            box-shadow: 0 4px 20px rgba(239, 71, 111, 0.2);
            transform: scale(1.05);
        }

        .mic-btn.active {
            background: linear-gradient(135deg, #ef476f 0%, #f78da7 100%);
            border-color: transparent;
            color: #ffffff;
            animation: mic-pulse 1.5s infinite;
        }

        @keyframes mic-pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 71, 111, 0.5); }
            70% { box-shadow: 0 0 0 15px rgba(239, 71, 111, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 71, 111, 0); }
        }

        .send-btn {
            width: 46px;
            height: 46px;
            background: linear-gradient(135deg, #7c3aed 0%, #4f46e5 100%);
            border-radius: 14px;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.3);
        }

        .send-btn:hover {
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 6px 20px rgba(124, 58, 237, 0.45);
        }

        .action-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .listening-overlay-close {
            position: absolute;
            top: 25px;
            right: 30px;
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            color: #f1f1f1;
            transition: all 0.3s;
        }

        .listening-overlay-close:hover {
            background: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

<div class="dashboard-container">
    <!-- Top Header -->
    <header class="dashboard-header">
        <div class="header-left">
            <div id="statusDot" class="status-dot"></div>
            <div class="header-title">
                <h2>B-Bot Assistant</h2>
                <p id="subTitle">Dynamic Account Operations</p>
            </div>
        </div>
        <div class="header-right">
            <!-- Voice Switch -->
            <label class="voice-toggle-label">
                <span>Voice Output (TTS)</span>
                <input id="ttsToggle" type="checkbox" class="voice-toggle-checkbox" checked>
            </label>
        </div>
    </header>

    <!-- Chat Messages Board -->
    <main id="chatBoard" class="chat-board">
        <div class="message assistant">
            Hi, I'm your premium banking transaction assistant! Ask me about your spending, merchant lists, transaction history, or specific date ranges.
        </div>
    </main>

    <!-- Voice Listening Full Overlay -->
    <div id="listeningOverlay" class="listening-overlay">
        <div id="overlayClose" class="listening-overlay-close">
            <svg viewBox="0 0 24 24" width="24" height="24">
                <path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
            </svg>
        </div>
        <h3>Listening to your voice...</h3>
        <div class="waveform">
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
        </div>
        <p id="liveTranscript">Say something like: "Show my grocery transactions"</p>
    </div>

    <!-- Bottom Input Area -->
    <footer class="chat-input-area">
        <!-- Microphone Button -->
        <button id="micBtn" class="action-btn mic-btn" title="Tap to Speak">
            <svg viewBox="0 0 24 24">
                <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
            </svg>
        </button>

        <!-- Message Box -->
        <div class="input-box-wrapper">
            <input id="userInput" type="text" placeholder="Type your transaction request..." onkeydown="if(event.key==='Enter') sendMessage();">
        </div>

        <!-- Send Button -->
        <button onclick="sendMessage()" class="action-btn send-btn" title="Send Message">
            <svg viewBox="0 0 24 24">
                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
            </svg>
        </button>
    </footer>
</div>

<script>
    const chatBoard = document.getElementById("chatBoard");
    const userInput = document.getElementById("userInput");
    const micBtn = document.getElementById("micBtn");
    const statusDot = document.getElementById("statusDot");
    const subTitle = document.getElementById("subTitle");
    const ttsToggle = document.getElementById("ttsToggle");
    const listeningOverlay = document.getElementById("listeningOverlay");
    const liveTranscript = document.getElementById("liveTranscript");
    const overlayClose = document.getElementById("overlayClose");

    let recognition = null;
    let isListening = false;
    let isSpeaking = false;

    // 🎙️ Setup Native Speech Recognition
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.continuous = false; // Stop when the user finishes speaking a single sentence
        recognition.interimResults = true; // Show results in real-time
        recognition.lang = 'en-US';

        recognition.onstart = () => {
            isListening = true;
            micBtn.classList.add("active");
            listeningOverlay.classList.add("active");
            statusDot.className = "status-dot listening";
            subTitle.textContent = "Listening...";
            liveTranscript.textContent = "Say something...";
            // Silence any ongoing speech synthesis
            stopSynthesis();
        };

        recognition.onresult = (event) => {
            let finalTranscript = '';
            let interimTranscript = '';
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    finalTranscript += event.results[i][0].transcript;
                } else {
                    interimTranscript += event.results[i][0].transcript;
                }
            }
            const currentTranscript = finalTranscript || interimTranscript;
            userInput.value = currentTranscript;
            liveTranscript.textContent = currentTranscript;
        };

        recognition.onend = () => {
            isListening = false;
            micBtn.classList.remove("active");
            listeningOverlay.classList.remove("active");
            statusDot.className = "status-dot";
            subTitle.textContent = "Dynamic Account Operations";
            
            // If the user spoke a query, automatically submit it
            const val = userInput.value.trim();
            if (val) {
                sendMessage();
            }
        };

        recognition.onerror = (event) => {
            console.error("Speech Recognition Error:", event.error);
            isListening = false;
            micBtn.classList.remove("active");
            listeningOverlay.classList.remove("active");
            statusDot.className = "status-dot";
            subTitle.textContent = "Dynamic Account Operations";
            if (event.error !== 'no-speech') {
                liveTranscript.textContent = "Error occurred: " + event.error;
            }
        };

        micBtn.onclick = () => {
            if (isListening) {
                recognition.stop();
            } else {
                recognition.start();
            }
        };

        overlayClose.onclick = () => {
            if (isListening) {
                recognition.abort();
            }
        };

    } else {
        console.warn("Speech Recognition API is not supported in this browser.");
        micBtn.style.display = "none";
    }

    // 🔊 Setup Text-to-Speech (SpeechSynthesis)
    function speakReply(text) {
        if (!ttsToggle.checked || !window.speechSynthesis) return;

        // Strip off any system truncation notifications for clean speech synthesis
        const cleanedText = text.replace(/\[System Notification:[^\]]+\]/g, '').trim();

        // Cancel any ongoing speech
        stopSynthesis();

        const utterance = new SpeechSynthesisUtterance(cleanedText);
        utterance.lang = 'en-US';
        
        utterance.onstart = () => {
            isSpeaking = true;
            statusDot.className = "status-dot speaking";
            subTitle.textContent = "Speaking reply...";
        };

        utterance.onend = () => {
            isSpeaking = false;
            statusDot.className = "status-dot";
            subTitle.textContent = "Dynamic Account Operations";
        };

        utterance.onerror = (e) => {
            console.error("Speech Synthesis Error:", e);
            isSpeaking = false;
            statusDot.className = "status-dot";
            subTitle.textContent = "Dynamic Account Operations";
        };

        window.speechSynthesis.speak(utterance);
    }

    function stopSynthesis() {
        if (window.speechSynthesis) {
            window.speechSynthesis.cancel();
            isSpeaking = false;
            statusDot.className = "status-dot";
        }
    }

    // ✉️ Send Chat Message
    async function sendMessage() {
        const queryText = userInput.value.trim();
        if (!queryText) return;

        // Stop any current speaking
        stopSynthesis();

        // Render user message bubble
        chatBoard.innerHTML += `<div class="message user">${escapeHtml(queryText)}</div>`;
        userInput.value = "";
        chatBoard.scrollTop = chatBoard.scrollHeight;

        // Add a loading/typing indicator bubble
        const typingId = "typing_" + Date.now();
        chatBoard.innerHTML += `<div id="${typingId}" class="message assistant">Generating response...</div>`;
        chatBoard.scrollTop = chatBoard.scrollHeight;

        try {
            const response = await fetch("/process", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    customer_id: "Cust_0410", // Standard mock user
                    session_id: "sess_web_dashboard",
                    user_query: queryText
                })
            });

            const reply = await response.json();
            
            // Remove typing bubble
            const typingBubble = document.getElementById(typingId);
            if (typingBubble) typingBubble.remove();

            // Extract potential System Notifications
            const hasNotification = reply.includes("[System Notification:");
            let cleanReply = reply;
            let noteHtml = "";
            if (hasNotification) {
                // Extract notification message
                const match = reply.match(/\[System Notification:([^\]]+)\]/);
                if (match) {
                    noteHtml = `<span class="system-note">⚠️ Note: ${escapeHtml(match[1])}</span>`;
                }
                cleanReply = reply.replace(/\[System Notification:[^\]]+\]/g, '').trim();
            }

            // Render assistant message bubble
            chatBoard.innerHTML += `
                <div class="message assistant">
                    ${escapeHtml(cleanReply).replace(/\n/g, '<br>')}
                    ${noteHtml}
                </div>
            `;
            chatBoard.scrollTop = chatBoard.scrollHeight;

            // Trigger Text-to-Speech
            speakReply(cleanReply);

        } catch (error) {
            console.error("API Fetch Error:", error);
            const typingBubble = document.getElementById(typingId);
            if (typingBubble) typingBubble.remove();
            
            chatBoard.innerHTML += `<div class="message assistant">Sorry, I encountered an error communicating with the banking gateway. Please try again.</div>`;
            chatBoard.scrollTop = chatBoard.scrollHeight;
        }
    }

    function escapeHtml(str) {
        return str
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }
</script>
</body>
</html>
